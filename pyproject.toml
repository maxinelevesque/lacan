[project]
name = "lacan"
version = "0.1.0"
description = "The text as patient"
readme = "README.md"
authors = [
    { name = "Maxine Levesque", email = "170461181+maxinelevesque@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "atdata>=0.1.1a3",
    "convokit>=3.5.0",
    "pandas>=2.3.3",
    "tqdm>=4.67.1",
]

[project.scripts]
lacan = "lacan:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--cov=atdata --cov-report=html"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]
